spring:
    application:
        name: bbdm
    output:
        ansi:
            enabled: ALWAYS
server:
    port: 8080
logging:
    level:
        root: INFO
    pattern:
        console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %highlight(%-5level) [%thread] %cyan(%logger{36}) %magenta(%kvp) - %msg%n"
dragonsofmugloar:
    api:
        base-url: https://dragonsofmugloar.com
    messages:
        filtered-probabilities:
            - Impossible
            - Suicide mission
        probability-order:
            - Piece of cake
            - Walk in the park
            - Sure thing
            - Quite likely
            - Hmmm...
            - Gamble
            - Rather detrimental
            - Impossible
            - Suicide mission
    scripting-adventure:
        last-life: 2
        no-lives: 0
        failed-missions-before-upgrades: 3
        upgrade-items-to-buy: 2
